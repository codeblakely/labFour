<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="stylesheet.css">
    <title>RGBYMC</title>


</head>



<body>
<!--My original idea was too complex so I reduced the scope to focus only on boxes that change colour when mixed-->


<!--first box that toggles red and black-->
<div id="box1">
<button id="button1" onclick="button1Clicked()">Red</button>
</div>

<!--second box that toggles green and black-->
<div id="box2"><button id="button2" onclick="button2Clicked()">Green</button></div>

<!--third box that toggles blue and black-->
<div id="box3"><button id="button3" onclick="button3Clicked()">Blue</button></div>

<!--fourth box connected to the red and green boxes, toggles black when one or both are false and yellow when both are true-->
<div id="box4"><button id="button4" onclick="button4Clicked()">Yellow!</button></div>

<!--same function as above but with red and blue-->
<div id="box5"><button id="button5" onclick="button5Clicked()">Magenta!</button></div>

<!--same function as above but with green and blue-->
<div id="box6"><button id="button6" onclick="button6Clicked()">Cyan!</button></div>







<script src="script.js"></script>
</body>





</html>
